<title id="fedTitle">Effective federal funds rate, 1976–2026</title>
<desc id="fedDesc">Line chart of the U.S. effective federal funds rate from January 1976 through January 2026, peaking near 19% in 1981, falling near zero after 2008 and again in 2020, and rising to roughly 5.3% in 2024 before easing to 3.6% by early 2026.</desc>
